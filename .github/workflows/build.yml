name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GH_BUILD_TOKEN || github.token }}

      - name: Fetch upstream version tags
        # Forks don't always carry upstream tags; the version string comes from git describe.
        run: git fetch --tags --force https://github.com/MausTec/edge-o-matic-3000 || true

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run -e eom3k

      - name: Publish firmware.bin to the firmware-builds branch
        if: github.event_name != 'pull_request'
        run: |
          set -e
          SHA=$(git rev-parse --short=8 HEAD)
          BR=${GITHUB_REF_NAME//\//-}
          mkdir -p /tmp/out && cp .pio/build/eom3k/firmware.bin /tmp/out/eom3k-$BR-$SHA.bin
          cd /tmp/out && sha256sum *.bin > eom3k-$BR-$SHA.sha256
          git init -q pub && cd pub
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git fetch -q --depth 1 origin firmware-builds; then git checkout -q -b firmware-builds FETCH_HEAD; else git checkout -q --orphan firmware-builds; fi
          cp /tmp/out/* .
          git add -A && git commit -qm "firmware $BR $SHA" && git push -q origin HEAD:firmware-builds

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/eom3k/firmware.bin
          if-no-files-found: error


  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_BUILD_TOKEN || github.token }}

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-native-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run native tests
        run: pio test -e native -v
